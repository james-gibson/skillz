name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Byte-compile
        run: python3 -m py_compile bin/skillz server/skillz_mcp.py
      - name: Verify the canon
        run: ./bin/skillz verify
      - name: Source ledger
        run: ./bin/skillz sync --check
      - name: Lifecycle smoke
        run: ./tests/smoke.sh
